<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한눈에 구독 관리</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b24; --panel-2:#1f2330; --line:#2a2f3d;
    --text:#e7e9ee; --muted:#9aa1b1; --soft:#6b7280;
    --accent:#6c8cff; --accent-2:#9b6cff; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
    --chip:#252a38;
    --shadow:0 8px 30px rgba(0,0,0,.35);
    --radius:16px;
  }
  body[data-theme="light"]{
    --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f3f5fa; --line:#e3e7ef;
    --text:#1a1f2b; --muted:#5c6679; --soft:#8a92a6;
    --chip:#eef1f7; --shadow:0 8px 30px rgba(60,80,140,.12);
    background:radial-gradient(1200px 700px at 80% -10%,#e9eefc 0,var(--bg) 55%);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%,#1b2030 0,var(--bg) 55%);
    color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 80px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:11px;font-size:14px;font-weight:600;transition:.15s}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;padding:11px 16px;box-shadow:var(--shadow)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:var(--chip);color:var(--text);padding:10px 14px;border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--panel-2)}
  .rate-box{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:7px 11px;font-size:13px;color:var(--muted)}
  .rate-box input{width:64px;background:transparent;border:none;color:var(--text);font-size:13px;font-weight:700;text-align:right}
  .rate-box input:focus{outline:none}

  /* alert banner */
  .banner{display:none;align-items:center;gap:13px;background:linear-gradient(135deg,rgba(248,113,113,.18),rgba(251,191,36,.12));border:1px solid rgba(248,113,113,.35);border-radius:14px;padding:13px 16px;margin-bottom:18px}
  .banner.on{display:flex}
  .banner .b-ico{font-size:22px}
  .banner .b-main{flex:1;min-width:0}
  .banner .b-title{font-weight:800;font-size:14px;margin-bottom:3px}
  .banner .b-list{color:var(--muted);font-size:12.5px;display:flex;gap:7px;flex-wrap:wrap}
  .banner .b-pill{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:11.5px;color:var(--text)}
  body[data-theme="light"] .banner .b-pill{background:rgba(255,255,255,.7)}
  .banner .b-close{background:transparent;border:none;color:var(--muted);font-size:18px;padding:4px 8px}
  .rate-refresh{background:transparent;border:none;color:var(--muted);font-size:14px;padding:2px 4px;cursor:pointer}
  .rate-refresh:hover{color:var(--text)}
  .rate-refresh.spin{animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .rate-meta{font-size:10.5px;color:var(--soft);margin-left:4px}
  .theme-btn{background:var(--chip);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:11px;font-size:17px}
  .theme-btn:hover{background:var(--panel-2)}
  .mini-input{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:5px 8px;color:var(--text);font-size:12px;font-family:inherit;font-weight:500}
  .mini-input:focus{outline:none;border-color:var(--accent)}
  input.mini-input{width:96px}

  /* summary cards */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;position:relative;overflow:hidden}
  .card .lbl{color:var(--muted);font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .card .val{font-size:26px;font-weight:800;letter-spacing:-.5px}
  .card .sub{color:var(--soft);font-size:12px;margin-top:6px}
  .card.accent{background:linear-gradient(135deg,rgba(108,140,255,.18),rgba(155,108,255,.10));border-color:#39406b}
  .glow{position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(108,140,255,.25),transparent 70%)}

  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .panel h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between}
  .panel h2 .hint{font-weight:500;color:var(--soft);font-size:12px}

  /* subscription list */
  .sub-list{display:flex;flex-direction:column;gap:10px;max-height:560px;overflow:auto}
  .sub-item{display:flex;align-items:center;gap:13px;background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:12px 13px;transition:.15s}
  .sub-item:hover{border-color:#3a4256;transform:translateY(-1px)}
  .sub-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#fff;flex-shrink:0}
  .sub-main{flex:1;min-width:0}
  .sub-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .sub-meta{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .tag{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .sub-price{text-align:right;flex-shrink:0}
  .sub-price .p{font-weight:800;font-size:15px}
  .sub-price .pm{color:var(--soft);font-size:11.5px;margin-top:2px}
  .sub-actions{display:flex;gap:6px;flex-shrink:0}
  .icon-btn{background:var(--chip);border:1px solid var(--line);width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
  .icon-btn:hover{background:var(--panel);color:var(--text)}
  .dday{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
  .dday.soon{background:rgba(251,191,36,.16);color:var(--warn)}
  .dday.urgent{background:rgba(248,113,113,.16);color:var(--bad)}
  .dday.ok{background:rgba(52,211,153,.14);color:var(--good)}

  /* calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head .m{font-weight:800;font-size:15px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal-dow{text-align:center;color:var(--soft);font-size:11px;padding:4px 0;font-weight:700}
  .cal-cell{aspect-ratio:1;border-radius:9px;background:var(--panel-2);border:1px solid transparent;padding:5px;font-size:12px;position:relative;min-height:42px}
  .cal-cell.empty{background:transparent}
  .cal-cell.today{border-color:var(--accent)}
  .cal-cell .d{color:var(--muted);font-weight:600}
  .cal-cell.has .d{color:var(--text)}
  .cal-dot{position:absolute;left:5px;right:5px;bottom:5px;display:flex;gap:3px;flex-wrap:wrap}
  .dot{width:6px;height:6px;border-radius:50%}
  .cal-amt{font-size:9.5px;color:var(--good);font-weight:800;position:absolute;right:5px;top:5px}

  /* charts */
  .chart-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
  .legend{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
  .legend .sw{width:11px;height:11px;border-radius:3px}
  .legend .amt{margin-left:auto;color:var(--text);font-weight:700}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
  .bar-name{width:92px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .bar-track{flex:1;background:var(--panel-2);border-radius:999px;height:14px;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .bar-val{width:78px;text-align:right;font-weight:700;font-size:12px}

  /* line chart */
  .line-wrap{width:100%}
  .line-wrap svg{width:100%;height:auto;display:block;overflow:visible}
  .line-dot{transition:r .12s}
  .line-hit:hover + .line-dot,.line-dot:hover{r:6}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:460px;padding:22px;box-shadow:var(--shadow);max-height:92vh;overflow:auto}
  .modal h3{margin:0 0 16px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .swatch-row{display:flex;gap:8px;flex-wrap:wrap}
  .swatch{width:30px;height:30px;border-radius:9px;cursor:pointer;border:2px solid transparent}
  .swatch.sel{border-color:#fff}
  .modal-actions{display:flex;gap:10px;margin-top:18px}
  .modal-actions button{flex:1;padding:12px}
  .btn-danger{background:rgba(248,113,113,.15);color:var(--bad);border:1px solid rgba(248,113,113,.3)}
  .empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:14px}
  .footer-note{text-align:center;color:var(--soft);font-size:12px;margin-top:30px}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chart-row{grid-template-columns:1fr}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#333a4d;border-radius:9px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">📊</div>
      <div>
        <h1>한눈에 구독 관리</h1>
        <p>Claude · OpenAI · Gemini 부터 모든 정기구독까지 한 곳에서</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="rate-box" title="USD를 원화로 환산할 때 쓰는 환율">
        💱 1 USD = <input id="rate" type="number" value="1380" min="1" /> 원
        <button class="rate-refresh" id="btnRate" title="최신 환율 가져오기 (인터넷 필요)">🔄</button>
        <span class="rate-meta" id="rateMeta"></span>
      </div>
      <button class="theme-btn" id="btnTheme" title="테마 전환">🌙</button>
      <button class="btn-ghost" id="btnExport">내보내기</button>
      <button class="btn-ghost" id="btnImport">가져오기</button>
      <button class="btn-primary" id="btnAdd">＋ 구독 추가</button>
    </div>
  </header>

  <div class="banner" id="banner">
    <div class="b-ico">🔔</div>
    <div class="b-main">
      <div class="b-title" id="bannerTitle"></div>
      <div class="b-list" id="bannerList"></div>
    </div>
    <button class="b-close" id="bannerClose" title="오늘 하루 숨기기">✕</button>
  </div>

  <section class="cards" id="cards"></section>

  <div class="grid">
    <div class="panel">
      <h2>내 구독 목록
        <span class="hint" style="display:flex;gap:6px;align-items:center">
          <input id="subSearch" class="mini-input" placeholder="🔍 검색" autocomplete="off" />
          <select id="subSort" class="mini-input">
            <option value="date">결제일 순</option>
            <option value="price-desc">가격 높은 순</option>
            <option value="price-asc">가격 낮은 순</option>
            <option value="name">이름 순</option>
          </select>
        </span>
      </h2>
      <div class="sub-list" id="subList"></div>
    </div>
    <div class="panel">
      <h2>결제 캘린더 <span class="hint" id="calMonthAmt"></span></h2>
      <div class="cal-head">
        <button class="icon-btn" id="calPrev">‹</button>
        <span class="m" id="calMonth"></span>
        <button class="icon-btn" id="calNext">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="panel" style="margin-top:18px">
    <h2>월별 사용료 추이 <span class="hint" id="lineHint">최근 6개월 · 이번 달 · 향후 5개월 · 원화 환산</span></h2>
    <div id="lineChart" class="line-wrap"></div>
  </div>

  <div class="chart-row">
    <div class="panel">
      <h2>서비스별 월 비용 <span class="hint">원화 환산</span></h2>
      <div id="barChart"></div>
    </div>
    <div class="panel">
      <h2>카테고리별 비중 <span class="hint">월 기준</span></h2>
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div id="donut"></div>
        <div class="legend" id="donutLegend" style="flex:1;min-width:150px"></div>
      </div>
    </div>
  </div>

  <p class="footer-note">데이터는 이 브라우저에만 저장됩니다 · 백업하려면 「내보내기」를 눌러 파일로 저장하세요</p>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">구독 추가</h3>
    <input type="hidden" id="editId" />
    <div class="field">
      <label>서비스 이름</label>
      <input id="fName" placeholder="예: Claude Pro, 넷플릭스" />
    </div>
    <div class="row2">
      <div class="field">
        <label>금액</label>
        <input id="fAmount" type="number" min="0" step="0.01" placeholder="0" />
      </div>
      <div class="field">
        <label>통화</label>
        <select id="fCurrency">
          <option value="KRW">원 (₩)</option>
          <option value="USD">달러 ($)</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>결제 주기</label>
        <select id="fCycle">
          <option value="weekly">매주</option>
          <option value="monthly">매월</option>
          <option value="yearly">매년</option>
          <option value="trial">무료체험 (종료일)</option>
        </select>
      </div>
      <div class="field">
        <label>카테고리</label>
        <select id="fCategory">
          <option>AI / 생산성</option>
          <option>엔터테인먼트</option>
          <option>음악</option>
          <option>클라우드 / 저장소</option>
          <option>뉴스 / 콘텐츠</option>
          <option>쇼핑 / 멤버십</option>
          <option>업무 / 협업</option>
          <option>기타</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label id="fDateLabel">다음 결제일</label>
      <input id="fDate" type="date" />
    </div>
    <div class="field">
      <label>색상</label>
      <div class="swatch-row" id="swatches"></div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <textarea id="fMemo" rows="2" placeholder="계정, 플랜 등 메모"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="btnDelete" style="display:none">삭제</button>
      <button class="btn-ghost" id="btnCancel">취소</button>
      <button class="btn-primary" id="btnSave">저장</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none" />

<script>
const COLORS = ["#6c8cff","#9b6cff","#34d399","#fbbf24","#f87171","#22d3ee","#f472b6","#a3e635","#fb923c","#818cf8"];
const LS_KEY = "subs_v1", LS_RATE = "subs_rate_v1";
let state = { subs: [], calDate: new Date() };
let pickedColor = COLORS[0];
let listSort = "date", listSearch = "";

/* ---------- storage ---------- */
function load(){
  try{ state.subs = JSON.parse(localStorage.getItem(LS_KEY)) || null; }catch(e){ state.subs = null; }
  if(!state.subs){ state.subs = seed(); save(); }
  const r = localStorage.getItem(LS_RATE); if(r) document.getElementById("rate").value = r;
}
let storageWarned=false;
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.subs)); return true; }
  catch(e){
    if(!storageWarned){ storageWarned=true;
      alert("브라우저 저장소에 접근할 수 없어 변경 내용이 영구 저장되지 않았습니다.\n\n· 시크릿(인쇄) 모드라면 일반 창에서 열어주세요.\n· 화면에는 정상 반영되며, 「내보내기」로 파일 백업은 가능합니다.");
    }
    return false;
  }
}
function getRate(){ return Math.max(1, Number(document.getElementById("rate").value)||1380); }

function seed(){
  const today = new Date();
  const d = (offset)=>{ const x=new Date(today); x.setDate(x.getDate()+offset); return x.toISOString().slice(0,10); };
  return [
    {id:uid(),name:"Claude Pro",amount:20,currency:"USD",cycle:"monthly",category:"AI / 생산성",date:d(5),color:"#9b6cff",memo:"Anthropic"},
    {id:uid(),name:"ChatGPT Plus",amount:20,currency:"USD",cycle:"monthly",category:"AI / 생산성",date:d(12),color:"#34d399",memo:"OpenAI"},
    {id:uid(),name:"Gemini Advanced",amount:29000,currency:"KRW",cycle:"monthly",category:"AI / 생산성",date:d(2),color:"#6c8cff",memo:"Google One AI"},
    {id:uid(),name:"넷플릭스",amount:17000,currency:"KRW",cycle:"monthly",category:"엔터테인먼트",date:d(9),color:"#f87171",memo:"프리미엄"},
    {id:uid(),name:"YouTube Premium",amount:14900,currency:"KRW",cycle:"monthly",category:"엔터테인먼트",date:d(20),color:"#fb923c",memo:""},
    {id:uid(),name:"Spotify",amount:10900,currency:"KRW",cycle:"monthly",category:"음악",date:d(25),color:"#a3e635",memo:"개인"},
    {id:uid(),name:"Perplexity Pro",amount:20,currency:"USD",cycle:"trial",category:"AI / 생산성",date:d(3),color:"#22d3ee",memo:"무료체험 종료 후 자동결제 주의"},
    {id:uid(),name:"쿠팡 로켓프레시",amount:4990,currency:"KRW",cycle:"weekly",category:"쇼핑 / 멤버십",date:d(1),color:"#f472b6",memo:"주간 배송"},
  ];
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- calc ---------- */
function isActive(s){ return s.active!==false; }
function monthlyCostRaw(s){
  if(s.cycle==="trial") return 0; // 무료체험은 월 비용에 포함하지 않음
  let amt = s.amount * (s.currency==="USD"?getRate():1);
  if(s.cycle==="yearly") amt/=12;
  else if(s.cycle==="weekly") amt*=52/12;
  return amt;
}
function toKRWmonthly(s){ return isActive(s) ? monthlyCostRaw(s) : 0; } // 일시정지 구독은 비용 미포함
function cycleLabel(c){ return c==="weekly"?"매주":c==="yearly"?"매년":c==="trial"?"무료체험":"매월"; }
function isExpired(s){ return s.cycle==="trial" && daysUntil(s.date)<0; }
function fmt(n){ return "₩"+Math.round(n).toLocaleString("ko-KR"); }
function daysUntil(dateStr){
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(dateStr); d.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
/* roll a past date forward to next occurrence for display */
function nextDate(s){
  let d = new Date(s.date); d.setHours(0,0,0,0);
  const t = new Date(); t.setHours(0,0,0,0);
  if(s.cycle==="trial"){ return d; }          // 종료일 고정
  if(s.cycle==="weekly"){ while(d < t){ d.setDate(d.getDate()+7); } }
  else if(s.cycle==="monthly"){ while(d < t){ d.setMonth(d.getMonth()+1); } }
  else{ while(d < t){ d.setFullYear(d.getFullYear()+1); } }
  return d;
}

function renderBanner(){
  const banner=document.getElementById("banner");
  if(localStorage.getItem("subs_banner_hide")===todayKey()){ banner.classList.remove("on"); return; }
  // 3일 이내 결제 예정 + 무료체험 종료 임박
  const items=[];
  state.subs.forEach(s=>{
    if(!isActive(s)) return;
    const nd=nextDate(s); const dd=daysUntil(nd.toISOString());
    if(s.cycle==="trial"){
      if(dd>=0 && dd<=3) items.push({s,dd,trial:true});
    }else if(dd>=0 && dd<=3){
      items.push({s,dd,trial:false});
    }
  });
  if(!items.length){ banner.classList.remove("on"); return; }
  items.sort((a,b)=>a.dd-b.dd);
  const trials=items.filter(i=>i.trial).length;
  document.getElementById("bannerTitle").textContent =
    `결제·종료 임박 ${items.length}건` + (trials?` (무료체험 종료 ${trials}건 포함)`:"");
  document.getElementById("bannerList").innerHTML = items.map(i=>{
    const dText=i.dd===0?"오늘":`D-${i.dd}`;
    const tag=i.trial?"체험종료":fmt(toBill(i.s));
    return `<span class="b-pill" style="border-color:${i.s.color}66">${dText} · ${esc(i.s.name)} · ${tag}</span>`;
  }).join("");
  banner.classList.add("on");
}

function renderCalendar(){
  const base=state.calDate; const y=base.getFullYear(), m=base.getMonth();
  document.getElementById("calMonth").textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const today=new Date(); today.setHours(0,0,0,0);
  // map day->subs
  const byDay={}; let monthTotal=0;
  state.subs.forEach(s=>{
    if(!isActive(s)) return;
    occurrencesInMonth(s,y,m).forEach(day=>{
      (byDay[day]=byDay[day]||[]).push(s);
      if(s.cycle!=="trial") monthTotal+=toBill(s);
    });
  });
  document.getElementById("calMonthAmt").textContent = monthTotal? "이 달 "+fmt(monthTotal):"";
  const dows=["일","월","화","수","목","금","토"];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join("");
  for(let i=0;i<first;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let day=1;day<=days;day++){
    const subs=byDay[day]||[];
    const cellDate=new Date(y,m,day); cellDate.setHours(0,0,0,0);
    const isToday = cellDate.getTime()===today.getTime();
    const amt = subs.reduce((a,s)=>a+(s.cycle==="trial"?0:toBill(s)),0);
    html+=`<div class="cal-cell ${subs.length?'has':''} ${isToday?'today':''}" ${subs.length?`title="${subs.map(s=>esc(s.name)).join(', ')}"`:''}>
      <div class="d">${day}</div>
      ${amt?`<div class="cal-amt">${Math.round(amt/1000)}k</div>`:''}
      <div class="cal-dot">${subs.slice(0,6).map(s=>`<span class="dot" style="background:${s.color}"></span>`).join("")}</div>
    </div>`;
  }
  document.getElementById("calGrid").innerHTML=html;
}
/* returns array of day-of-month this sub bills in given year/month */
function occurrencesInMonth(s,y,m){
  const start=new Date(s.date); start.setHours(0,0,0,0);
  const day=start.getDate();
  const lastDay=new Date(y,m+1,0).getDate();
  if(s.cycle==="trial"){
    return (start.getFullYear()===y && start.getMonth()===m) ? [day] : [];
  }
  if(s.cycle==="weekly"){
    const out=[]; const d=new Date(start);
    const monthStart=new Date(y,m,1), monthEnd=new Date(y,m,lastDay);
    // advance to within/after month range
    while(d<monthStart){ d.setDate(d.getDate()+7); }
    while(d<=monthEnd){ out.push(d.getDate()); d.setDate(d.getDate()+7); }
    return out;
  }
  if(s.cycle==="monthly"){
    const startMonth=new Date(start.getFullYear(),start.getMonth(),1);
    if(new Date(y,m,1)<startMonth) return [];
    return [Math.min(day,lastDay)];
  }
  // yearly
  return (start.getMonth()===m && y>=start.getFullYear()) ? [day] : [];
}

/* 특정 연/월에 결제되는 총액(원화, 무료체험 제외)
   추이용: '다음 결제일' 기준으로 과거·미래 모두 반복된다고 가정해 투영 */
function monthBillTotal(y,m){
  let t=0;
  const lastDay=new Date(y,m+1,0).getDate();
  state.subs.forEach(s=>{
    if(s.cycle==="trial" || !isActive(s)) return;
    const anchor=new Date(s.date);
    if(s.cycle==="monthly"){
      t+=toBill(s);                                  // 매월 1회
    }else if(s.cycle==="yearly"){
      if(anchor.getMonth()===m) t+=toBill(s);        // 매년, 해당 월만
    }else if(s.cycle==="weekly"){
      const wd=anchor.getDay();                      // 기준 요일이 이 달에 나오는 횟수
      let cnt=0;
      for(let day=1;day<=lastDay;day++){ if(new Date(y,m,day).getDay()===wd) cnt++; }
      t+=toBill(s)*cnt;
    }
  });
  return t;
}
function niceCeil(v){
  if(v<=0) return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  const f = n<=1?1 : n<=2?2 : n<=2.5?2.5 : n<=5?5 : 10;
  return f*p;
}
function shortWon(n){
  n=Math.round(n);
  if(n>=10000){ const v=n/10000; return (v>=10?Math.round(v):Math.round(v*10)/10)+"만"; }
  return n.toLocaleString("ko-KR");
}

function renderLine(){
  const el=document.getElementById("lineChart");
  const now=new Date();
  // 최근 6개월 ~ 향후 5개월 (이번 달 포함 12개월)
  const CUR=6;
  const data=[];
  for(let i=-CUR;i<=5;i++){
    const d=new Date(now.getFullYear(), now.getMonth()+i, 1);
    data.push({y:d.getFullYear(), m:d.getMonth(), v:monthBillTotal(d.getFullYear(),d.getMonth())});
  }
  const maxV=Math.max(...data.map(d=>d.v),1);
  const niceMax=niceCeil(maxV);
  const n=data.length;

  const W=760,H=280, padL=58,padR=20,padT=24,padB=42;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const X=i=> padL + i*plotW/(n-1);
  const Y=v=> padT + plotH - (v/niceMax)*plotH;

  // 가로 격자 + Y축 라벨
  const gridN=4; let grid="";
  for(let i=0;i<=gridN;i++){
    const gv=niceMax*i/gridN, gy=Y(gv);
    grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--line)" stroke-width="1"/>`;
    grid+=`<text x="${padL-9}" y="${gy+4}" text-anchor="end" fill="var(--soft)" font-size="10">${shortWon(gv)}</text>`;
  }

  // 영역 + 선 경로
  const areaPath=`M ${X(0)} ${Y(0)} `+data.map((d,i)=>`L ${X(i)} ${Y(d.v)}`).join(" ")+` L ${X(n-1)} ${Y(0)} Z`;
  const linePts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(" ");

  // 점 + 값 라벨 + X축 라벨
  let dots="", vlabels="", xlabels="";
  data.forEach((d,i)=>{
    const cur=i===CUR, px=X(i), py=Y(d.v);
    dots+=`<circle class="line-dot" cx="${px}" cy="${py}" r="${cur?5:3.5}" fill="${cur?'var(--accent)':'var(--panel)'}" stroke="var(--accent)" stroke-width="2"><title>${d.y}년 ${d.m+1}월 · ${fmt(d.v)}</title></circle>`;
    if(d.v>0) vlabels+=`<text x="${px}" y="${py-10}" text-anchor="middle" fill="${cur?'var(--text)':'var(--muted)'}" font-size="9.5" font-weight="${cur?'800':'600'}">${shortWon(d.v)}</text>`;
    const label = (d.m===0||i===0) ? `${String(d.y).slice(2)}.${d.m+1}` : `${d.m+1}월`;
    xlabels+=`<text x="${px}" y="${H-padB+18}" text-anchor="middle" fill="${cur?'var(--text)':'var(--soft)'}" font-size="10" font-weight="${cur?'800':'400'}">${label}</text>`;
  });
  // 이번 달 세로 강조선
  const curLine=`<line x1="${X(CUR)}" y1="${padT}" x2="${X(CUR)}" y2="${padT+plotH}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>`;

  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 사용료 추이">
    <defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    ${curLine}
    <path d="${areaPath}" fill="url(#lineGrad)"/>
    <polyline points="${linePts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${vlabels}
    ${dots}
    ${xlabels}
  </svg>`;
}

function renderDonut(){
  const map={};
  state.subs.forEach(s=>{ map[s.category]=(map[s.category]||0)+toKRWmonthly(s); });
  const entries=Object.entries(map).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const total=entries.reduce((a,e)=>a+e[1],0);
  const size=150, r=60, cx=size/2, cy=size/2, sw=24;
  let acc=0; const segs=[];
  entries.forEach(([cat,v],i)=>{
    const frac=total?v/total:0;
    const col=COLORS[i%COLORS.length];
    const start=acc*2*Math.PI - Math.PI/2;
    acc+=frac;
    const end=acc*2*Math.PI - Math.PI/2;
    const large = frac>0.5?1:0;
    const x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start);
    const x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    if(frac>=0.999){
      segs.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/>`);
    }else if(frac>0){
      segs.push(`<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="butt"/>`);
    }
    e_color(cat,col,v);
  });
  document.getElementById("donut").innerHTML=`<svg width="${size}" height="${size}">${segs.join("")}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" fill="var(--muted)" font-size="11">월 합계</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" fill="var(--text)" font-size="14" font-weight="800">${fmt(total)}</text>
  </svg>`;
  document.getElementById("donutLegend").innerHTML = legendHTML;
  legendHTML="";
}
let legendHTML="";
function e_color(cat,col,v){ legendHTML+=`<div class="li"><span class="sw" style="background:${col}"></span>${esc(cat)}<span class="amt">${fmt(v)}</span></div>`; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function saveSub(){
  const name=document.getElementById("fName").value.trim();
  const amount=Number(document.getElementById("fAmount").value);
  if(!name){ alert("서비스 이름을 입력하세요."); return; }
  if(!(amount>=0)){ alert("금액을 입력하세요."); return; }
  const obj={
    name, amount,
    currency:document.getElementById("fCurrency").value,
    cycle:document.getElementById("fCycle").value,
    category:document.getElementById("fCategory").value,
    date:document.getElementById("fDate").value||new Date().toISOString().slice(0,10),
    color:pickedColor,
    memo:document.getElementById("fMemo").value.trim()
  };
  const id=document.getElementById("editId").value;
  if(id){ const i=state.subs.findIndex(x=>x.id===id); state.subs[i]={...state.subs[i],...obj}; }
  else{ obj.id=uid(); state.subs.push(obj); }

  closeModal();
  try{ render(); }catch(e){ console.error(e); alert("화면 갱신 중 오류: "+e.message); }
}
function deleteSub(){
  const id=document.getElementById("editId").value;
  if(id && confirm("이 구독을 삭제할까요?")){ state.subs=state.subs.filter(x=>x.id!==id); save(); closeModal(); render(); }
}
function toggleActive(id){
  const s=state.subs.find(x=>x.id===id); if(!s) return;
  s.active = !isActive(s);   // 일시정지 ↔ 활성 토글 (기록은 유지)
  save(); render();
}

/* ---------- import/export ---------- */
function exportData(){
  const blob=new Blob([JSON.stringify(state.subs,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="구독관리_백업.json"; a.click();
}
function importData(){ document.getElementById("fileInput").click(); }
document.getElementById("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!Array.isArray(data)){ alert("올바른 백업 파일이 아닙니다."); return; }
      const cycles=["weekly","monthly","yearly","trial"];
      const valid=[]; let skipped=0;
      for(const s of data){
        if(!s || typeof s!=="object" || typeof s.name!=="string" || !s.name.trim()){ skipped++; continue; }
        const amount=Number(s.amount);
        valid.push({
          id: (typeof s.id==="string" && s.id) ? s.id : uid(),
          name: s.name.trim(),
          amount: amount>=0 ? amount : 0,
          currency: s.currency==="USD" ? "USD" : "KRW",
          cycle: cycles.includes(s.cycle) ? s.cycle : "monthly",
          category: (typeof s.category==="string" && s.category) ? s.category : "기타",
          date: /^\d{4}-\d{2}-\d{2}$/.test(s.date) ? s.date : new Date().toISOString().slice(0,10),
          color: (typeof s.color==="string" && /^#[0-9a-fA-F]{3,8}$/.test(s.color)) ? s.color : COLORS[0],
          memo: typeof s.memo==="string" ? s.memo : "",
          active: s.active!==false
        });
      }
      if(!valid.length){ alert("가져올 수 있는 항목이 없습니다.\n올바른 백업 파일인지 확인해 주세요."); return; }
      state.subs=valid; save(); render();
      alert(`가져오기 완료! ${valid.length}개 항목` + (skipped?`\n(형식 오류 ${skipped}개는 건너뛰었어요)`:""));
    }catch(err){ alert("파일을 읽을 수 없습니다."); }
  };
  r.readAsText(f); e.target.value="";
});

/* ---------- events ---------- */
document.getElementById("btnAdd").onclick=openAdd;
document.getElementById("btnSave").onclick=saveSub;
document.getElementById("btnCancel").onclick=closeModal;
document.getElementById("btnDelete").onclick=deleteSub;
document.getElementById("btnExport").onclick=exportData;
document.getElementById("btnImport").onclick=importData;
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });
document.getElementById("subSearch").addEventListener("input",e=>{ listSearch=e.target.value; renderList(); });
document.getElementById("subSort").addEventListener("change",e=>{ listSort=e.target.value; renderList(); });
document.addEventListener("keydown",e=>{
  if(!document.getElementById("overlay").classList.contains("on")) return;
  if(e.key==="Escape"){ closeModal(); }
  else if(e.key==="Enter" && e.target.tagName!=="TEXTAREA"){ e.preventDefault(); saveSub(); }
});
document.getElementById("rate").addEventListener("input",()=>{ localStorage.setItem(LS_RATE,getRate()); render(); });
document.getElementById("calPrev").onclick=()=>{ state.calDate.setMonth(state.calDate.getMonth()-1); renderCalendar(); };
document.getElementById("calNext").onclick=()=>{ state.calDate.setMonth(state.calDate.getMonth()+1); renderCalendar(); };
document.getElementById("fCycle").addEventListener("change",updateDateLabel);
document.getElementById("bannerClose").onclick=()=>{ localStorage.setItem("subs_banner_hide",todayKey()); document.getElementById("banner").classList.remove("on"); };

/* ---------- theme ---------- */
function applyTheme(t){
  document.body.setAttribute("data-theme",t);
  document.getElementById("btnTheme").textContent = t==="light"?"☀️":"🌙";
  localStorage.setItem("subs_theme",t);
}
document.getElementById("btnTheme").onclick=()=>{
  applyTheme(document.body.getAttribute("data-theme")==="light"?"dark":"light");
};

/* ---------- exchange rate auto-update ---------- */
async function fetchRate(manual){
  const btn=document.getElementById("btnRate"); btn.classList.add("spin");
  const sources=[
    {url:"https://api.frankfurter.app/latest?from=USD&to=KRW", pick:d=>d.rates&&d.rates.KRW},
    {url:"https://open.er-api.com/v6/latest/USD", pick:d=>d.rates&&d.rates.KRW},
  ];
  for(const src of sources){
    try{
      const res=await fetch(src.url); if(!res.ok) continue;
      const data=await res.json(); const krw=src.pick(data);
      if(krw){
        const v=Math.round(krw);
        document.getElementById("rate").value=v;
        localStorage.setItem(LS_RATE,v);
        localStorage.setItem("subs_rate_date",todayKey());
        document.getElementById("rateMeta").textContent="자동";
        document.getElementById("rateMeta").title="오늘 자동 갱신됨";
        btn.classList.remove("spin"); render();
        if(manual) flashRate();
        return true;
      }
    }catch(e){ /* try next */ }
  }
  btn.classList.remove("spin");
  if(manual) alert("환율을 가져오지 못했습니다. 인터넷 연결을 확인하세요.\n(수동으로 입력해도 됩니다.)");
  return false;
}
function flashRate(){
  const m=document.getElementById("rateMeta"); m.textContent="✓ 갱신됨";
  setTimeout(()=>{ m.textContent="자동"; },1500);
}
document.getElementById("btnRate").onclick=()=>fetchRate(true);

/* ---------- init ---------- */
applyTheme(localStorage.getItem("subs_theme")||"dark");
load(); buildSwatches(); render();
// 하루 한 번 자동 환율 갱신 (인터넷 있을 때만)
if(localStorage.getItem("subs_rate_date")!==todayKey()){ fetchRate(false); }
</script>
